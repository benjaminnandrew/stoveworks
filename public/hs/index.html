<style>
/* Layout: a workbench. The room photo is the work surface; the materials rail sits to
   its right (below it on phones). Iron-and-spruce neutrals keep the stone the only color. */
:root {
  --bg: #111413;
  --surface: #181d1b;
  --surface-2: #202725;
  --raise: #283130;
  --line: #2f3836;
  --fg: #eceae4;
  --fg-2: #a6aca7;
  --fg-3: #737a76;
  --accent: #7dbba3;
  --accent-ink: #0f1a16;
  --ember: #e2763d;
  --warn: #d7a64a;
  --stage: #0b0d0d;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --tap: 40px;
  --rail: 400px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8e6e1; --surface: #f4f3ef; --surface-2: #fbfaf8; --raise: #ffffff; --line: #d4d1c9;
    --fg: #1c1f1e; --fg-2: #565c59; --fg-3: #858a86; --accent: #2e6a56; --accent-ink: #f4fbf8;
    --ember: #c4562a; --warn: #9a6a12; --stage: #d9d6cf; --shadow: 0 10px 30px rgba(40,35,25,.14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8e6e1; --surface: #f4f3ef; --surface-2: #fbfaf8; --raise: #ffffff; --line: #d4d1c9;
  --fg: #1c1f1e; --fg-2: #565c59; --fg-3: #858a86; --accent: #2e6a56; --accent-ink: #f4fbf8;
  --ember: #c4562a; --warn: #9a6a12; --stage: #d9d6cf; --shadow: 0 10px 30px rgba(40,35,25,.14);
  color-scheme: light;
}
/* The showroom kiosk always runs dark (it is a lit screen in a showroom). */
.app[data-mode="kiosk"] {
  --bg: #0e1110; --surface: #151a18; --surface-2: #1d2422; --raise: #263030; --line: #2c3533;
  --fg: #f0eee8; --fg-2: #aab0ab; --fg-3: #7a817c; --accent: #86c4ab; --accent-ink: #0f1a16;
  --ember: #e77f45; --stage: #090b0b; --tap: 56px; --rail: 460px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; min-height: 0; color: var(--fg); background: var(--bg); }
.app[data-mode="kiosk"] { font-size: 17px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { flex: none; display: grid; width: 40px; height: 40px; }
.brand .logo img { grid-area: 1 / 1; width: 100%; height: 100%; display: block; }
.brand .logo .lg-light { display: none; }   /* the badge as drawn (white disc) on light screens, light ink on dark ones */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .app:not([data-mode="kiosk"]) .brand .logo .lg-light { display: block; }
  :root:not([data-theme="dark"]) .app:not([data-mode="kiosk"]) .brand .logo .lg-dark { display: none; }
}
:root[data-theme="light"] .app:not([data-mode="kiosk"]) .brand .logo .lg-light { display: block; }
:root[data-theme="light"] .app:not([data-mode="kiosk"]) .brand .logo .lg-dark { display: none; }
.app[data-mode="kiosk"] .brand .logo { width: 64px; height: 64px; }
.app[data-mode="kiosk"] .topbar { padding-block: 7px; }   /* the bigger badge without a taller bar */
.brand .bt { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
.brand .b1 { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.brand .b2 { font-size: 11px; color: var(--fg-2); letter-spacing: .14em; text-transform: uppercase; margin-top: 3px; white-space: nowrap; }
.top-actions { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: .93em; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .86em; }
.btn:disabled { opacity: .42; cursor: default; transform: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
a.btn { text-decoration: none; }
.btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 0 12px; min-height: calc(var(--tap) - 2px); font-weight: 600; font-size: .86em; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.mode-switch { display: flex; align-items: center; gap: 8px; }
.mode-switch .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }

/* ---------- workspace ---------- */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--rail); }
.stage-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--stage); }
.stage { position: relative; flex: 1; min-height: 260px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage svg.overlay .hit { pointer-events: all; }
.chips { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(10,12,12,.62); color: #f1efe9; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.12); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.chip.roombtn { pointer-events: auto; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; padding: 5px 8px 5px 11px; }
.chip.roombtn svg { width: 14px; height: 14px; }
.chip.roombtn:hover { background: rgba(10,12,12,.8); }
.app[data-mode="kiosk"] .chip.roombtn { font-size: 14px; padding: 9px 12px 9px 15px; }
.roompop { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 46px; z-index: 6; width: min(340px, calc(100% - 24px)); padding: 6px; border-radius: 14px; background: rgba(12, 14, 14, .92); border: 1px solid rgba(255, 255, 255, .14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 14px 34px rgba(0, 0, 0, .45); display: flex; flex-direction: column; gap: 2px; }
.roompop .rp { display: flex; align-items: center; gap: 10px; padding: 6px; border: 0; border-radius: 10px; background: none; color: #f1efe9; text-align: left; min-height: 48px; }
.roompop .rp:hover { background: rgba(255, 255, 255, .08); }
.roompop .rp[aria-current="true"] { background: rgba(134, 196, 171, .16); box-shadow: inset 0 0 0 1px rgba(134, 196, 171, .5); }
.roompop .rp img, .roompop .rp i { width: 64px; height: 42px; border-radius: 6px; object-fit: cover; flex: none; display: grid; place-items: center; background: rgba(255, 255, 255, .06); }
.roompop .rp i svg { width: 20px; height: 20px; }
.roompop .rp > span { display: flex; flex-direction: column; min-width: 0; }
.roompop .rp b { font-size: 13.5px; }
.roompop .rp span span { font-size: 11.5px; color: #b9c2bd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roompop .rp.small { min-height: 34px; justify-content: center; color: #c9cfca; font-size: 12px; }
.app[data-mode="kiosk"] .roompop { top: 58px; width: min(420px, calc(100% - 24px)); }
.app[data-mode="kiosk"] .roompop .rp { min-height: 64px; }
.stage-tools { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; flex-direction: column; gap: 8px; }
/* picture tools: solid enough to read over any photo; on the showroom screen each says what it does */
.tool { width: var(--tap); height: var(--tap); border-radius: 12px; border: 1px solid rgba(255,255,255,.34); background: rgba(14,17,16,.86); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.tool:hover { background: rgba(30,36,34,.94); border-color: rgba(255,255,255,.55); }
.tool svg { width: 21px; height: 21px; flex: none; }
.tool .tl { display: none; }
.tool[aria-pressed="true"] { background: #f1efe9; color: #111; border-color: #f1efe9; }
.app[data-mode="kiosk"] .stage-tools { align-items: flex-end; }
.app[data-mode="kiosk"] .tool { width: auto; padding: 0 17px 0 14px; border-radius: 14px; font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.app[data-mode="kiosk"] .tool .tl { display: inline; white-space: nowrap; }
.app[data-mode="kiosk"] .tool svg { width: 22px; height: 22px; }
.stage.toolrow .stage-tools { flex-direction: row; align-items: center; }
.caption { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
.caption .cap { pointer-events: auto; max-width: 70%; padding: 8px 12px; border-radius: 12px; background: rgba(10,12,12,.66); color: #f1efe9; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.12); }
.cap .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #b9c2bd; }
.cap .v { font-weight: 600; font-size: 14px; }
.cap .m { font-family: var(--f-mono); font-size: 11.5px; color: #c9cfca; }
.split { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; cursor: ew-resize; touch-action: none; }
.split::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: #f4f2ec; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.split .knob { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; transform: translate(-50%,-50%); border-radius: 50%; background: #f4f2ec; color: #111; display: grid; place-items: center; box-shadow: var(--shadow); }
.split .tag { position: absolute; top: 14px; padding: 3px 8px; border-radius: 6px; background: rgba(10,12,12,.7); color: #f1efe9; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.split .tag.l { right: 30px; } .split .tag.r { left: 30px; }
.busy { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.busy .sp { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--ember); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hovertip { position: absolute; z-index: 3; pointer-events: none; padding: 5px 9px; border-radius: 8px; background: rgba(10,12,12,.78); color: #f1efe9; font-size: 12px; font-weight: 600; white-space: nowrap; }
.quicktip { position: fixed; z-index: 70; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: rgba(10,12,12,.92); color: #f1efe9; font-size: 12.5px; font-weight: 600; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
body:has(.app[data-mode="kiosk"]) .quicktip { font-size: 16px; padding: 9px 14px; border-radius: 10px; }

/* quick rail of swatches under the stage */
.quick { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-top: 1px solid var(--line); scrollbar-width: thin; }
.qs { flex: none; display: flex; flex-direction: column; gap: 5px; width: 92px; padding: 0; border: 0; background: none; text-align: left; color: var(--fg-2); font-size: 11px; line-height: 1.2; }
.qs img { width: 92px; height: 58px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; background: var(--surface-2); }
.qs[aria-pressed="true"] img { border-color: var(--accent); }
.qs[aria-pressed="true"] { color: var(--fg); }
.app[data-mode="kiosk"] .qs { width: 128px; font-size: 13px; }
.app[data-mode="kiosk"] .qs img { width: 128px; height: 80px; }

/* ---------- side rail ---------- */
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.tabs { display: flex; padding-top: 8px; padding-bottom: 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1; min-height: var(--tap); border: 0; background: none; color: var(--fg-2); font-weight: 600; font-size: .9em; padding: 0 8px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.rail-body { flex: 1; min-height: 0; overflow-y: auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.rail-body > * { flex-shrink: 0; }   /* a long panel scrolls; its parts (like the clipped-looking segmented buttons) never squash */
.rail-foot { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.h { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; line-height: 1.05; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.sub { color: var(--fg-2); font-size: .93em; margin: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { min-height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg-2); font-size: .86em; font-weight: 600; }
.pill[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.app[data-mode="kiosk"] .pill { min-height: 44px; padding: 0 16px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { position: relative; display: flex; flex-direction: column; gap: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); text-align: left; }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--raise); }
.card .t { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.card .n { font-weight: 600; font-size: .92em; line-height: 1.2; }
.card .c { font-size: .8em; color: var(--fg-3); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .badge { position: absolute; left: 8px; top: 8px; }
.badge { padding: 2px 7px; border-radius: 6px; background: rgba(10,12,12,.66); color: #f2efe8; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
/* the stone catalog: search, style and color filters, the list grouped by style */
.catbrowse { gap: 12px; }
.cathead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cathead .h { font-size: 18px; margin: 0; }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 12px; width: 18px; height: 18px; color: var(--fg-3); pointer-events: none; }
.search input { width: 100%; min-height: 44px; padding: 8px 12px 8px 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 15px; }
.search input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.facets { display: flex; flex-direction: column; gap: 8px; }
.stys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sty { display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg-2); text-align: left; font-size: .86em; }
.sty b { font-weight: 600; flex: 1; min-width: 0; line-height: 1.15; }
.art { flex: none; width: 36px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.1; color: var(--fg-3); }
.sty .art.all { display: grid; place-items: center; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border: 1px dashed currentColor; border-radius: 4px; }
.sty[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.sty[aria-pressed="true"] .art { color: var(--accent); }
.sty:disabled, .pill:disabled { opacity: .4; cursor: default; }
.ct { font-size: .86em; color: var(--fg-3); font-variant-numeric: tabular-nums; font-weight: 600; }
.pill .ct { margin-left: 2px; }
.pill.tone { display: inline-flex; align-items: center; gap: 6px; }
.tdots { display: inline-flex; padding-left: 3px; }
.tdots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); margin-left: -3px; }
.catcount { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; color: var(--fg-2); font-size: .9em; }
.catcount b { color: var(--fg); }
.catresults { display: flex; flex-direction: column; gap: 20px; }
.catgroup { display: flex; flex-direction: column; gap: 10px; }
.gh { position: sticky; top: -16px; z-index: 2; display: flex; align-items: center; gap: 10px; margin: 0 -2px; padding: 8px 2px; background: var(--surface); font-size: 1em; font-weight: 400; }
.gh b { display: block; font-size: 1.02em; font-weight: 700; }
.gh .note { display: block; }
.catempty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; }
.tonerow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sibs { display: flex; flex-direction: column; gap: 6px; }
.sibrow { display: flex; gap: 6px; flex-wrap: wrap; }
.sib { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 3px 12px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: .84em; font-weight: 600; }
.sib img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.sib:hover { color: var(--fg); border-color: var(--fg-3); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font: inherit; cursor: pointer; }
.detail .links { gap: 14px; }
.detail .links a, .detail .note a { color: var(--accent); }

/* the strip under the picture: a small label where each style starts */
