<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340" role="img" aria-label="Freestanding stove placeholder">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="0.45" stop-color="#1e1e20"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a12"/>
      <stop offset="0.55" stop-color="#e07a1c"/>
      <stop offset="1" stop-color="#f7c344"/>
    </linearGradient>
  </defs>

  <!-- flue -->
  <rect x="103" y="0" width="34" height="62" fill="#1a1a1c"/>
  <rect x="97" y="54" width="46" height="14" rx="3" fill="#2a2a2d"/>

  <!-- body -->
  <path d="M40 68h160a14 14 0 0 1 14 14v186a14 14 0 0 1-14 14H40a14 14 0 0 1-14-14V82a14 14 0 0 1 14-14Z" fill="url(#body)"/>

  <!-- top plate -->
  <rect x="20" y="62" width="200" height="16" rx="6" fill="#2e2e31"/>

  <!-- door glass -->
  <rect x="52" y="104" width="136" height="122" rx="6" fill="#0b0b0c"/>
  <rect x="60" y="112" width="120" height="106" rx="4" fill="url(#glass)" opacity="0.92"/>

  <!-- logs -->
  <g fill="#4a2a10" opacity="0.75">
    <rect x="70" y="188" width="100" height="12" rx="6"/>
    <rect x="84" y="172" width="72" height="11" rx="5.5"/>
  </g>

  <!-- door handle -->
  <rect x="192" y="152" width="8" height="30" rx="4" fill="#8b8b90"/>

  <!-- ash lip -->
  <rect x="34" y="236" width="172" height="14" rx="4" fill="#2a2a2d"/>

  <!-- legs -->
  <rect x="46" y="282" width="20" height="42" rx="4" fill="#242427"/>
  <rect x="174" y="282" width="20" height="42" rx="4" fill="#242427"/>
</svg>
